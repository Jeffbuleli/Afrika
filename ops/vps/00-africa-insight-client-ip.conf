# Client IP map for Africa Insight nginx (Cloudflare → real visitor IP).
# Install on the Africa Insight VPS as:
#   /etc/nginx/conf.d/00-africa-insight-client-ip.conf
#
# If you already have an equivalent map under another name, keep one source of truth.

map $http_cf_connecting_ip $ai_client_ip {
  default $remote_addr;
  "~."    $http_cf_connecting_ip;
}
