# Reverse proxy for Africa Insight on VPS 162.35.181.98
# Canonical host: www.africa-insight.org
# Place under /etc/nginx/sites-available/africa-insight.org and symlink sites-enabled.
#
# Requires: /etc/nginx/conf.d/00-mcbuleli-client-ip.conf (map $mcb_client_ip)
#
# TLS: /etc/letsencrypt/live/africa-insight.org/ (www + apex).
# If only www is issued yet, symlink or set CERT_NAME accordingly in issue-cert.sh.

upstream africa_insight_web {
  server 127.0.0.1:3002;
  keepalive 32;
}

# --- New domain: HTTP (ACME + redirect to www) ---
server {
  listen 80;
  listen [::]:80;
  server_name www.africa-insight.org africa-insight.org;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://www.africa-insight.org$request_uri;
  }
}

# Apex HTTPS → www (requires cert covering africa-insight.org)
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name africa-insight.org;

  ssl_certificate /etc/letsencrypt/live/africa-insight.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/africa-insight.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  return 301 https://www.africa-insight.org$request_uri;
}

# Canonical site
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.africa-insight.org;

  ssl_certificate /etc/letsencrypt/live/africa-insight.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/africa-insight.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 25m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Long-cache hashed Next assets (improves repeat visits / LCP)
  location /_next/static/ {
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Service worker must never be long-cached; scope must be site root.
  location = /sw.js {
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header Service-Worker-Allowed "/" always;
  }

  location = /manifest.webmanifest {
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache" always;
  }

  location ~* \.(?:jpg|jpeg|gif|png|webp|avif|ico|svg|woff2)$ {
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  location / {
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $mcb_client_ip;
    proxy_set_header X-Forwarded-For $mcb_client_ip;
    proxy_set_header CF-Connecting-IP $mcb_client_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}

# --- Legacy McBuleli subdomain → new domain (301 SEO) ---
server {
  listen 80;
  listen [::]:80;
  server_name africa.mcbuleli.org;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://www.africa-insight.org$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name africa.mcbuleli.org;

  ssl_certificate /etc/letsencrypt/live/africa.mcbuleli.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/africa.mcbuleli.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  return 301 https://www.africa-insight.org$request_uri;
}
