# Reverse proxy for Africa Insight on VPS 162.35.181.98
# Place under /etc/nginx/sites-available/africa.mcbuleli.org and symlink sites-enabled.
# TLS: certbot, or reuse /etc/ssl/mcbuleli/ after issuing africa.mcbuleli.org cert.
#
# Requires: /etc/nginx/conf.d/00-mcbuleli-client-ip.conf (map $mcb_client_ip)

upstream africa_insight_web {
  server 127.0.0.1:3002;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name africa.mcbuleli.org;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://africa.mcbuleli.org$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name africa.mcbuleli.org;

  ssl_certificate /etc/letsencrypt/live/africa.mcbuleli.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/africa.mcbuleli.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 25m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  location / {
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $mcb_client_ip;
    proxy_set_header X-Forwarded-For $mcb_client_ip;
    proxy_set_header CF-Connecting-IP $mcb_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
