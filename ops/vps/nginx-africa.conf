# Reverse proxy for Africa Insight on VPS 153.75.235.176
# Canonical host: www.africa-insight.org
# Place under /etc/nginx/sites-available/africa-insight.org and symlink sites-enabled.
#
# Requires: client IP map - prefer:
#   /etc/nginx/conf.d/00-africa-insight-client-ip.conf  ($ai_client_ip)
# Legacy compatible fallback name on some hosts: $mcb_client_ip (same map logic).

upstream africa_insight_web {
  server 127.0.0.1:3002;
  keepalive 32;
}

# Rate-limit zones (http context - this file is included from http {})
# Use $ai_client_ip when the new map file is installed; else redefine map alias.
limit_req_zone $ai_client_ip zone=ai_contact:10m rate=3r/m;
limit_req_zone $ai_client_ip zone=ai_login:10m rate=3r/m;

# --- New domain: HTTP (ACME + redirect to www) ---
server {
  listen 80;
  listen [::]:80;
  server_name www.africa-insight.org africa-insight.org;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://www.africa-insight.org$request_uri;
  }
}

# Apex HTTPS → www (requires cert covering africa-insight.org)
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name africa-insight.org;

  ssl_certificate /etc/letsencrypt/live/africa-insight.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/africa-insight.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  return 301 https://www.africa-insight.org$request_uri;
}

# Canonical site
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.africa-insight.org;

  ssl_certificate /etc/letsencrypt/live/africa-insight.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/africa-insight.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 25m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Defense-in-depth CSP (app also sets CSP via Next headers)
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; upgrade-insecure-requests" always;

  # Long-cache hashed Next assets (improves repeat visits / LCP)
  location /_next/static/ {
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Public uploads - never execute; browsers honor MIME + nosniff
  location /uploads/ {
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  # Basic abuse throttle for public contact API
  location = /api/contact {
    limit_req zone=ai_contact burst=8 nodelay;
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $ai_client_ip;
    proxy_set_header X-Forwarded-For $ai_client_ip;
    proxy_set_header CF-Connecting-IP $ai_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Login brute-force throttle (stricter)
  location = /api/admin/login {
    limit_req zone=ai_login burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $ai_client_ip;
    proxy_set_header X-Forwarded-For $ai_client_ip;
    proxy_set_header CF-Connecting-IP $ai_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location = /api/admin/csrf {
    limit_req zone=ai_login burst=10 nodelay;
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $ai_client_ip;
    proxy_set_header X-Forwarded-For $ai_client_ip;
    proxy_set_header CF-Connecting-IP $ai_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location ^~ /admin {
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $ai_client_ip;
    proxy_set_header X-Forwarded-For $ai_client_ip;
    proxy_set_header CF-Connecting-IP $ai_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
  }

  # Service worker must never be long-cached; scope must be site root.
  location = /sw.js {
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header Service-Worker-Allowed "/" always;
  }

  location = /manifest.webmanifest {
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache" always;
  }

  location ~* \.(?:jpg|jpeg|gif|png|webp|avif|ico|svg|woff2)$ {
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  location / {
    proxy_pass http://africa_insight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $ai_client_ip;
    proxy_set_header X-Forwarded-For $ai_client_ip;
    proxy_set_header CF-Connecting-IP $ai_client_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}

# NOTE: africa.mcbuleli.org is intentionally NOT served here.
# Delink from McBuleli: remove DNS + disable any vhost on 162.35.181.98.
