# Africa Insight — VPS stack (Next.js + SQLite volume)
# Usage (from ops/vps):
#   cp .env.example .env   # fill secrets
#   docker compose up -d --build

name: africa-insight

services:
  web:
    build:
      context: ../..
      dockerfile: ops/vps/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: https://www.africa-insight.org
        ADMIN_EMAIL: ${ADMIN_EMAIL:-editor@africa-insight.org}
        ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
        AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: file:./data/africa-insight.db
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Canonical public URL (do not inherit stale .env from old subdomain)
      NEXT_PUBLIC_APP_URL: https://www.africa-insight.org
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - africa_data:/app/data
      - africa_uploads:/app/public/uploads

volumes:
  africa_data:
  africa_uploads:
